<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>时间记录</title>
<style>
  :root { --bg:#12141a; --card:#1b1e26; --line:#2a2f3a; --fg:#e8ebf2; --dim:#98a1b3; --accent:#5b8cff; --warn:#ff6b6b; --ok:#3ecf8e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif; display:flex; flex-direction:column; }
  header { padding:18px 18px 8px; }
  header h1 { margin:0; font-size:15px; font-weight:500; color:var(--dim); }
  main { flex:1; overflow-y:auto; padding:0 14px 84px; }
  section[hidden] { display:none; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  input[type=text] { width:100%; padding:13px 14px; font-size:17px; background:#0e1015; color:var(--fg); border:1px solid var(--line); border-radius:12px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  .clock { font-variant-numeric:tabular-nums; font-size:52px; font-weight:300; text-align:center; margin:16px 0 4px; }
  .sub { text-align:center; color:var(--dim); font-size:13px; min-height:18px; }
  button.primary { width:100%; margin-top:14px; padding:18px; border:0; border-radius:14px; font-size:18px; font-weight:600; color:#fff; background:var(--accent); }
  button.primary.stop { background:var(--warn); }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .val { color:var(--dim); font-variant-numeric:tabular-nums; flex:0 0 auto; font-size:13px; }
  .rec { display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .rec:last-child { border-bottom:0; }
  .rec .l { min-width:0; }
  .rec .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec .meta { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .rec .d { color:var(--fg); font-variant-numeric:tabular-nums; font-size:14px; flex:0 0 auto; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#0e1015; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:15px 0; background:none; border:0; color:var(--dim); font-size:14px; }
  nav button.on { color:var(--accent); font-weight:600; }
  .hours { display:flex; align-items:flex-end; gap:3px; height:88px; margin-top:10px; }
  .hours div { flex:1; background:#2b3550; border-radius:3px 3px 0 0; min-height:2px; }
  .axis { display:flex; justify-content:space-between; color:var(--dim); font-size:10px; margin-top:4px; }
  .tag { display:inline-block; font-size:12px; color:var(--dim); }
  .statgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .statgrid .k { color:var(--dim); font-size:12px; }
  .statgrid .v { font-size:21px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .muted { color:var(--dim); font-size:12px; }
  button.ghost, a.btn { display:inline-block; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:#0e1015; color:var(--fg); font-size:14px; text-decoration:none; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:20; }
  .modal[hidden] { display:none; }
  .sheet { width:100%; background:var(--card); border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin:0 0 12px; font-size:16px; font-weight:600; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .field span { color:var(--dim); font-size:14px; }
  input[type=time] { background:#0e1015; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:16px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .actions button { flex:1; padding:13px; border-radius:12px; border:1px solid var(--line); background:#0e1015; color:var(--fg); font-size:15px; }
  .actions button.save { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .actions button.del { color:var(--warn); }
  .banner { background:#2a2118; border:1px solid #4a3a22; color:#e8c07d; font-size:12px; padding:10px 12px; border-radius:12px; margin-bottom:12px; }
</style>
</head>
<body>
<header><h1 id="today"></h1></header>

<main>
  <section id="view-timer">
    <div id="backupBanner" class="banner" hidden></div>
    <div class="card">
      <input id="task" type="text" list="tasks" placeholder="在做什么？（留空＝沿用上一个）" autocomplete="off">
      <datalist id="tasks"></datalist>
      <div class="clock" id="clock">00:00:00</div>
      <div class="sub" id="sub">还没开始</div>
      <button class="primary" id="toggle">开始</button>
    </div>
    <div class="card">
      <div class="row"><span class="tag">今天</span><span class="val" id="todayTotal">0m</span></div>
      <div id="todayList"></div>
    </div>
    <div class="card">
      <div class="tag" style="margin-bottom:8px">今天的时间线（点一条可改时间）</div>
      <div id="timeline"></div>
    </div>
  </section>

  <section id="view-stats" hidden>
    <div class="card">
      <div class="statgrid">
        <div><div class="k">今日总时长</div><div class="v" id="sToday">—</div></div>
        <div><div class="k">记录条数</div><div class="v" id="sCount">—</div></div>
        <div><div class="k">最长一段</div><div class="v" id="sLongest">—</div></div>
        <div><div class="k">切换次数</div><div class="v" id="sSwitch">—</div></div>
        <div><div class="k">碎片段（&lt;5 分钟）</div><div class="v" id="sFrag">—</div></div>
        <div><div class="k">碎片总时长</div><div class="v" id="sFragTime">—</div></div>
      </div>
      <div class="muted" style="margin-top:10px">碎片 = 短于 5 分钟的会话。段数多、总时长也不低，说明时间被频繁打断。</div>
    </div>
    <div class="card">
      <div class="tag">今天的小时分布</div>
      <div class="hours" id="hours"></div>
      <div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
    </div>
    <div class="card"><div class="tag">按任务</div><div id="taskStats"></div></div>
    <div class="card">
      <div class="tag" style="margin-bottom:8px">数据</div>
      <div class="muted" id="dataInfo"></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" id="csvBtn" href="#">导出 CSV</a>
        <a class="btn" id="jsonBtn" href="#">导出 JSON</a>
        <button class="ghost" id="importBtn">导入 JSON</button>
        <button class="ghost" id="addBtn">手动补记</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<nav>
  <button id="navTimer" class="on">计时</button>
  <button id="navStats">统计</button>
</nav>

<div class="modal" id="edit" hidden>
  <div class="sheet">
    <h3 id="editTitle">修改记录</h3>
    <div class="field"><span>开始</span><input type="time" step="1" id="editStart"></div>
    <div class="field"><span>结束</span><input type="time" step="1" id="editEnd"></div>
    <div class="field"><span>任务名</span><input type="text" id="editTask" style="max-width:60%;padding:8px 10px;font-size:15px"></div>
    <div class="actions">
      <button class="del" id="editDel">删除</button>
      <button id="editCancel">取消</button>
      <button class="save" id="editSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var LS_RECORDS = 'tt.records.v2';
  var LS_ACTIVE  = 'tt.active.v2';

  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert('存储失败：' + e.message); } }

  var records = load(LS_RECORDS, []);
  var active  = load(LS_ACTIVE, null);

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
  }
  function human(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return Math.round(ms / 1000) + 's';
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h' + pad(m % 60) + 'm';
  }
  function dayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function isToday(ts) { return ts >= dayStart(); }
  function clockOf(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  /* ---------- 计时 ---------- */
  function tick() {
    if (!active) {
      $('clock').textContent = '00:00:00';
      $('toggle').textContent = '开始';
      $('toggle').classList.remove('stop');
      $('sub').textContent = '还没开始';
      return;
    }
    $('clock').textContent = hms(Date.now() - active.start);
    $('toggle').textContent = '停止';
    $('toggle').classList.add('stop');
    $('sub').textContent = '进行中：' + active.task + ' · 开始于 ' + clockOf(active.start);
  }

  function lastTask() { return records.length ? records[records.length - 1].task : ''; }

  function start() {
    var v = $('task').value.trim();
    var task = (v || lastTask() || '未命名').slice(0, 60);
    active = { task: task, start: Date.now() };
    save(LS_ACTIVE, active);
    $('task').value = '';
    tick();
  }

  function stop() {
    if (!active) return;
    var end = Date.now();
    if (end - active.start >= 3000) {
      records.push({ id: String(active.start) + '-' + String(end), task: active.task, start: active.start, end: end });
      save(LS_RECORDS, records);
    }
    active = null;
    save(LS_ACTIVE, null);
    tick(); render();
  }

  $('toggle').addEventListener('click', function () { active ? stop() : start(); });

  /* ---------- 手动补记 / 编辑 ---------- */
  var editingId = null;

  function openEditor(rec, isNew) {
    editingId = isNew ? null : rec.id;
    $('editTitle').textContent = isNew ? '补记一条' : '修改记录';
    var base = rec ? new Date(rec.start) : new Date(Date.now() - 600000);
    var endD = rec ? new Date(rec.end) : new Date();
    $('editStart').value = pad(base.getHours()) + ':' + pad(base.getMinutes()) + ':' + pad(base.getSeconds());
    $('editEnd').value = pad(endD.getHours()) + ':' + pad(endD.getMinutes()) + ':' + pad(endD.getSeconds());
    $('editTask').value = rec ? rec.task : '';
    $('editDel').style.display = isNew ? 'none' : '';
    $('edit').hidden = false;
    window.__editBaseDay = base.toDateString();
  }

  function closeEditor() { $('edit').hidden = true; editingId = null; }

  $('editCancel').addEventListener('click', closeEditor);

  $('editSave').addEventListener('click', function () {
    var sv = $('editStart').value, ev = $('editEnd').value;
    if (!sv || !ev) { alert('请填开始和结束时间'); return; }
    var day = new Date(window.__editBaseDay);
    var sp = sv.split(':'), ep = ev.split(':');
    var start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), +sp[0], +sp[1], +(sp[2] || 0)).getTime();
    var end = new Date(day.getFullYear(), day.getMonth(), day.getDate(), +ep[0], +ep[1], +(ep[2] || 0)).getTime();
    if (end <= start) { alert('结束时间必须晚于开始时间'); return; }
    var task = ($('editTask').value.trim() || '未命名').slice(0, 60);
    if (editingId) {
      for (var i = 0; i < records.length; i++) {
        if (records[i].id === editingId) { records[i].task = task; records[i].start = start; records[i].end = end; break; }
      }
    } else {
      records.push({ id: String(start) + '-' + String(end) + '-' + Math.random().toString(36).slice(2, 7), task: task, start: start, end: end });
    }
    records.sort(function (a, b) { return a.start - b.start; });
    save(LS_RECORDS, records);
    closeEditor(); render();
  });

  $('editDel').addEventListener('click', function () {
    if (!editingId) return;
    if (!confirm('删除这条记录？')) return;
    records = records.filter(function (r) { return r.id !== editingId; });
    save(LS_RECORDS, records);
    closeEditor(); render();
  });

  $('addBtn').addEventListener('click', function () { openEditor(null, true); });

  /* ---------- 渲染 ---------- */
  function render() {
    var today = records.filter(function (r) { return isToday(r.start); }).sort(function (a, b) { return a.start - b.start; });
    var byTask = {};
    today.forEach(function (r) { byTask[r.task] = (byTask[r.task] || 0) + (r.end - r.start); });
    var total = today.reduce(function (a, r) { return a + (r.end - r.start); }, 0);

    $('todayTotal').textContent = human(total);
    $('todayList').innerHTML = Object.keys(byTask).map(function (k) { return [k, byTask[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; })
      .map(function (p) { return '<div class="row"><span class="name">' + esc(p[0]) + '</span><span class="val">' + human(p[1]) + '</span></div>'; })
      .join('') || '<div class="muted" style="padding:8px 0">今天还没有记录</div>';

    var names = [];
    records.forEach(function (r) { if (names.indexOf(r.task) < 0) names.push(r.task); });
    $('tasks').innerHTML = names.slice(-30).reverse().map(function (t) { return '<option value="' + esc(t) + '">'; }).join('');

    $('timeline').innerHTML = today.slice().reverse().map(function (r) {
      return '<div class="rec" data-id="' + esc(r.id) + '">' +
        '<div class="l"><div class="t">' + esc(r.task) + '</div>' +
        '<div class="meta">' + clockOf(r.start) + ' → ' + clockOf(r.end) + '</div></div>' +
        '<div class="d">' + hms(r.end - r.start) + '</div></div>';
    }).join('') || '<div class="muted">—</div>';

    Array.prototype.forEach.call(document.querySelectorAll('#timeline .rec'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var rec = records.filter(function (r) { return r.id === id; })[0];
        if (rec) openEditor(rec, false);
      });
    });

    /* 统计 */
    $('sToday').textContent = human(total);
    $('sCount').textContent = String(today.length);
    $('sLongest').textContent = today.length ? human(Math.max.apply(null, today.map(function (r) { return r.end - r.start; }))) : '—';

    var sw = 0;
    for (var i = 1; i < today.length; i++) {
      if (today[i].task !== today[i - 1].task && today[i].start - today[i - 1].end < 15 * 60000) sw++;
    }
    $('sSwitch').textContent = String(sw);

    var frag = today.filter(function (r) { return r.end - r.start < 5 * 60000; });
    var fragMs = frag.reduce(function (a, r) { return a + (r.end - r.start); }, 0);
    $('sFrag').textContent = String(frag.length);
    $('sFragTime').textContent = human(fragMs);

    var hours = new Array(24).fill(0);
    today.forEach(function (r) { hours[new Date(r.start).getHours()] += r.end - r.start; });
    var maxH = Math.max.apply(null, [1].concat(hours));
    $('hours').innerHTML = hours.map(function (v) {
      return '<div style="height:' + Math.round(v / maxH * 88) + 'px;opacity:' + (v ? 1 : .22) + '"></div>';
    }).join('');

    var stats = {};
    today.forEach(function (r) {
      var s = stats[r.task] || { ms: 0, n: 0 };
      s.ms += r.end - r.start; s.n++; stats[r.task] = s;
    });
    $('taskStats').innerHTML = Object.keys(stats).map(function (k) { return [k, stats[k]]; })
      .sort(function (a, b) { return b[1].ms - a[1].ms; })
      .map(function (p) {
        return '<div class="row"><span class="name">' + esc(p[0]) + '</span><span class="val">' + human(p[1].ms) + ' · ' + p[1].n + ' 次 · 均 ' + human(p[1].ms / p[1].n) + '</span></div>';
      }).join('') || '<div class="muted">—</div>';

    var days = new Set(records.map(function (r) { return new Date(r.start).toDateString(); }));
    $('dataInfo').textContent = '共 ' + records.length + ' 条记录，跨 ' + days.size + ' 天。数据只存在这台设备的浏览器里，建议每周导出一次 JSON 备份。';
  }

  /* ---------- 导出 / 导入 ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }

  $('csvBtn').addEventListener('click', function (e) {
    e.preventDefault();
    var rows = [['任务', '开始', '结束', '时长(分钟)', '时长(秒)']];
    records.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (r) {
      rows.push([r.task, new Date(r.start).toLocaleString('zh-CN'), new Date(r.end).toLocaleString('zh-CN'),
        ((r.end - r.start) / 60000).toFixed(2), ((r.end - r.start) / 1000).toFixed(1)]);
    });
    var csv = '\ufeff' + rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download('timetrack-' + new Date().toISOString().slice(0, 10) + '.csv', csv, 'text/csv;charset=utf-8');
  });

  $('jsonBtn').addEventListener('click', function (e) {
    e.preventDefault();
    download('timetrack-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(records, null, 2), 'application/json');
  });

  $('importBtn').addEventListener('click', function () { $('importFile').click(); });

  $('importFile').addEventListener('change', function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(String(reader.result));
        if (!Array.isArray(incoming)) throw new Error('不是数组');
        var ids = new Set(records.map(function (r) { return r.id; }));
        var added = 0;
        incoming.forEach(function (r) {
          if (!r || typeof r.start !== 'number' || typeof r.end !== 'number') return;
          if (ids.has(r.id)) return;
          records.push({ id: r.id || String(r.start) + '-' + String(r.end), task: String(r.task || '未命名').slice(0, 60), start: r.start, end: r.end });
          added++;
        });
        records.sort(function (a, b) { return a.start - b.start; });
        save(LS_RECORDS, records);
        render();
        alert('导入完成，新增 ' + added + ' 条');
      } catch (e) { alert('导入失败：' + e.message); }
    };
    reader.readAsText(file, 'utf-8');
    ev.target.value = '';
  });

  /* ---------- 备份提醒 ---------- */
  function backupCheck() {
    var last = Number(localStorage.getItem('tt.lastExport') || 0);
    var days = Math.floor((Date.now() - last) / 86400000);
    var banner = $('backupBanner');
    if (records.length && (last === 0 || days >= 7)) {
      banner.hidden = false;
      banner.textContent = last === 0
        ? '还没有备份过。数据只在这台手机上，建议现在去「统计 → 导出 JSON」存一份。'
        : '已经 ' + days + ' 天没备份了，去「统计 → 导出 JSON」存一份吧。';
    } else { banner.hidden = true; }
  }
  $('jsonBtn').addEventListener('click', function () { localStorage.setItem('tt.lastExport', String(Date.now())); });

  /* ---------- 导航 ---------- */
  function switchView(v) {
    $('view-timer').hidden = v !== 'timer';
    $('view-stats').hidden = v !== 'stats';
    $('navTimer').classList.toggle('on', v === 'timer');
    $('navStats').classList.toggle('on', v === 'stats');
    render(); backupCheck();
  }
  $('navTimer').addEventListener('click', function () { switchView('timer'); });
  $('navStats').addEventListener('click', function () { switchView('stats'); });

  /* ---------- 启动 ---------- */
  $('today').textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  tick(); render(); backupCheck();
  setInterval(tick, 500);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
